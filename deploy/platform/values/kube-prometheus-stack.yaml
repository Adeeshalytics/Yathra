# Prometheus, Alertmanager, Grafana, node-exporter, kube-state-metrics and the Prometheus
# Operator — sized for one small node. See docs/devops/05-observability.md.
fullnameOverride: monitoring

crds:
  enabled: true

# k3s runs the scheduler, controller manager and etcd inside one process and does not expose
# their metrics, so scraping them (and the alerts about them) would only ever report "down".
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  # The validating webhook needs certificates made by Helm hook jobs; on one node, with rules
  # linted in CI, it is not worth the moving parts.
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 192Mi

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 4GB
    # Pick up every ServiceMonitor, PodMonitor and PrometheusRule in the cluster — the Yathra
    # chart ships its own — not only those labelled for this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  # Alerts are visible in Grafana and Alertmanager straight away. To receive them on your
  # phone, add a Discord webhook (docs/devops/05-observability.md, "Getting alerts").
  config:
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
    receivers:
      - name: "null"

grafana:
  # Grafana is reached only through `kubectl port-forward`, i.e. by someone who already
  # administers the cluster, so it skips its own login rather than keep another password.
  grafana.ini:
    auth:
      disable_login_form: true
    auth.anonymous:
      enabled: true
      org_role: Editor
    analytics:
      reporting_enabled: false
      check_for_updates: false
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      # Dashboards shipped by applications (the Yathra chart) live in their own namespaces.
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi
