# Argo CD for a one-node cluster: no SSO, no ApplicationSets, no notifications (D5), modest
# resources. The UI is not exposed to the internet; reach it with `kubectl port-forward`.
global:
  domain: localhost

configs:
  params:
    # TLS is provided by the port-forward tunnel; the server itself speaks plain HTTP.
    server.insecure: true
  cm:
    # How often Argo CD compares Git with the cluster (it also syncs on a manual refresh).
    timeout.reconciliation: 120s
    # Argo CD stopped judging the health of Application objects in 1.8. The app-of-apps
    # pattern needs it back: the root app's sync waves only wait for a child app (say, the
    # cert-manager install) if its health is known.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  enabled: false

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

server:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
