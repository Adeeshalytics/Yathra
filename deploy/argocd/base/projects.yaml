# Projects limit what each Application may deploy, and where. A mistake in the Yathra chart
# cannot touch kube-system or create cluster-wide objects other than its own namespace.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  description: Cluster-wide components every environment relies on.
  sourceRepos:
    - https://github.com/Adeeshalytics/Yathra.git
    - https://charts.jetstack.io
    - https://cloudnative-pg.github.io/charts
    - https://bitnami.github.io/sealed-secrets
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: monitoring
  # Operators install CRDs, cluster roles and admission webhooks.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: yathra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  description: The Yathra environments.
  sourceRepos:
    - https://github.com/Adeeshalytics/Yathra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: yathra-*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
