# An S3-compatible object store for the local cluster (RustFS), standing in for Oracle Object
# Storage so database backups and the restore drill can be tested on this machine.
# `make object-store` applies it. The credentials below are for this throwaway local store only.
apiVersion: v1
kind: Namespace
metadata:
  name: object-store
---
apiVersion: v1
kind: Secret
metadata:
  name: rustfs
  namespace: object-store
stringData:
  RUSTFS_ACCESS_KEY: local-backups
  RUSTFS_SECRET_KEY: local-backups-not-a-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: object-store
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0
          args: ["server", "/data"]
          env:
            - name: RUSTFS_ADDRESS
              value: ":9000"
          envFrom:
            - secretRef:
                name: rustfs
          ports:
            - containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: 9000
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs
  namespace: object-store
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: object-store
spec:
  selector:
    app: rustfs
  ports:
    - port: 9000
