# A k3d cluster on this machine (deploy/local). Plain HTTP on http://yathra.localhost
host: yathra.localhost

image:
  tag: local
  # `make images` builds the images and imports them into the cluster; nothing is pulled.
  pullPolicy: Never

tls:
  enabled: false

django:
  logFormat: console
  extraEnv:
    # A load test runs from one machine, i.e. one address; at the normal limits it would
    # measure the rate limiter instead of the app (deploy/tests/load). Both rates: DRF's
    # UserRateThrottle also limits anonymous requests, per address, at the "user" rate.
    THROTTLE_RATE_ANON: 100000/min
    THROTTLE_RATE_USER: 100000/min

postgres:
  storage:
    size: 1Gi

metrics:
  enabled: true

backend:
  # Proven here with `make load-test VUS=80`: more API pods under load, back to one after.
  autoscaling:
    enabled: true
