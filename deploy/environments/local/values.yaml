# A k3d cluster on this machine (deploy/local). Plain HTTP on http://yathra.localhost
host: yathra.localhost

image:
  tag: local
  # `make images` builds the images and imports them into the cluster; nothing is pulled.
  pullPolicy: Never

tls:
  enabled: false

django:
  logFormat: console
  extraEnv:
    # A load test runs from one machine, i.e. one address; at the normal 120/min per address
    # it would measure the rate limiter instead of the app (deploy/tests/load).
    THROTTLE_RATE_ANON: 100000/min

postgres:
  storage:
    size: 1Gi

metrics:
  enabled: true
