# Staging on the Oracle Cloud node. Argo CD deploys this file; CI rewrites image.tag after every
# successful build of main. Change anything else by pull request.
host: staging.yathra.example.com # set to your staging domain (docs/devops/04-gitops.md)

image:
  tag: sha-de7229c

tls:
  enabled: true
  # Switch to letsencrypt-prod once a staging certificate has been issued.
  clusterIssuer: letsencrypt-staging

django:
  settingsModule: config.settings.staging

postgres:
  storage:
    size: 5Gi

metrics:
  enabled: true

backup:
  # PostgreSQL to Oracle Object Storage (bucket yathra-backups, infra/terraform/cluster), through
  # its S3-compatible API. Set the endpoint's namespace — `terraform -chdir=infra/terraform/cluster
  # output -raw backup_endpoint` — and seal the keys (docs/devops/06-reliability.md).
  enabled: true
  destinationPath: s3://yathra-backups/staging
  endpointURL: https://NAMESPACE.compat.objectstorage.ap-hyderabad-1.oraclecloud.com
  regionFromSecret: true
