{{- with .Values.django.sealedSecret }}
{{- /*
The app's Secret, encrypted for this environment's cluster and committed to Git
(deploy/environments/<name>/secrets.yaml, written by deploy/scripts/new-app-secret.sh). The
Sealed Secrets controller decrypts it into the Secret the pods read. The encryption is bound
to this name and namespace: copied anywhere else it cannot be decrypted.
*/ -}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $.Values.django.secretName }}
  labels:
    {{- include "yathra.labels" $ | nindent 4 }}
spec:
  encryptedData:
    {{- toYaml . | nindent 4 }}
  template:
    metadata:
      name: {{ $.Values.django.secretName }}
      labels:
        {{- include "yathra.labels" $ | nindent 8 }}
{{- end }}
