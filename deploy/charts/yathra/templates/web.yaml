{{- $component := dict "ctx" . "component" "web" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yathra.fullname" . }}-web
  labels:
    {{- include "yathra.componentLabels" $component | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "yathra.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yathra.componentLabels" $component | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "yathra.podSecurityContext" (dict "uid" 100 "gid" 101) | nindent 8 }}
      containers:
        - name: web
          image: {{ include "yathra.image" (dict "ctx" . "name" "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          # "/" is prerendered at build time, so it is a cheap page to probe.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            {{- include "yathra.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            # Next.js keeps its runtime cache here; everything else in the image is read-only.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yathra.fullname" . }}-web
  labels:
    {{- include "yathra.componentLabels" $component | nindent 4 }}
spec:
  selector:
    {{- include "yathra.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
