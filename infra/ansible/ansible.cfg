# Used through ANSIBLE_CONFIG (the Makefile sets it): Ansible ignores an ansible.cfg in the
# current directory when that directory is world-writable, which /mnt/c paths are under WSL.
[defaults]
inventory = inventory.yml
roles_path = roles
remote_user = ubuntu
private_key_file = ~/.ssh/yathra_oci
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = false

[ssh_connection]
pipelining = true
# First connection to a new server records its host key; a changed key later is refused.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
