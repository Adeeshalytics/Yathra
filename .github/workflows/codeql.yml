# CodeQL: static analysis that looks for security bugs in the source (injection, unsafe
# deserialisation, missing escaping, risky workflow patterns, …). Results appear under the
# repository's Security → Code scanning tab. Free for public repositories.
#
# This is CodeQL's "advanced setup". Leave the "default setup" in the repository settings
# switched off, or GitHub refuses to process these results.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 03:30 Sri Lanka time: new queries catch old code too.
    - cron: "0 22 * * 0"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # "actions" scans the workflow files themselves, e.g. for script injection.
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none # interpreted languages: nothing to compile
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
