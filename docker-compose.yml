# Local development stack: PostgreSQL, Redis, Django API and Next.js.
# Usage: copy .env.example to .env, then `docker compose up --build`.
name: yathra

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yathra}
      POSTGRES_USER: ${POSTGRES_USER:-yathra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      DATABASE_URL: postgres://${POSTGRES_USER:-yathra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yathra}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-15}
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: ${JWT_REFRESH_TOKEN_LIFETIME_DAYS:-7}
      JWT_REFRESH_COOKIE_SECURE: "false"
      # Payments. "mock" is the built-in test gateway; set PAYHERE_* in .env for real payments.
      # The line on the route map: any OSRM-compatible service (docs/route-maps.md).
      ROUTING_SERVICE_URL: ${ROUTING_SERVICE_URL:-https://router.project-osrm.org}
      # Texts and e-mails: "console" writes them to this container's log (docs/notifications.md).
      SMS_BACKEND: ${SMS_BACKEND:-console}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-NotifyDEMO}
      NOTIFYLK_USER_ID: ${NOTIFYLK_USER_ID:-}
      NOTIFYLK_API_KEY: ${NOTIFYLK_API_KEY:-}
      EMAIL_URL: ${EMAIL_URL:-consolemail://}
      PAYMENT_PROVIDERS: ${PAYMENT_PROVIDERS:-mock}
      # Both must be reachable from the browser: gateways redirect customers to them.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID:-}
      PAYHERE_MERCHANT_SECRET: ${PAYHERE_MERCHANT_SECRET:-}
      PAYHERE_SANDBOX: ${PAYHERE_SANDBOX:-true}
      PAYHERE_APP_ID: ${PAYHERE_APP_ID:-}
      PAYHERE_APP_SECRET: ${PAYHERE_APP_SECRET:-}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      # Read by the browser, so it must be the host-reachable URL, not the compose service name.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Yathra}
      # File-change events don't cross the Windows/macOS bind-mount boundary; poll instead.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
